name: Update Wire Report

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Build Wire
        run: python build_wire.py

      - name: Commit wire
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add wire.txt
          git diff --cached --quiet || git commit -m "Update wire"
          git push
